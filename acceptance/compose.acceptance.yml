# 受入ハーネス専用の studio。本番構成には持ち込まない。
#
# なぜ専用サービスが要るか（2つとも実測に基づく）:
#
#  1. **本番ビルドでは dev-login が存在しない。**
#     app/api/auth/dev-login/route.ts は `process.env.NODE_ENV !== "production"` が条件だが、
#     next build は NODE_ENV をインライン展開するため、本番成果物では分岐ごと消えている。
#     受入基準8（他人の行に直打ち）と9（SVG/HTML が attachment）は
#     ログイン済みセッションを3つ使い分ける必要があるので、dev ビルドが要る。
#
#  2. **compose.yml は container_name を固定していて並列に立てられない。**
#     -p でプロジェクト名を分けても同じコンテナ名を取り合う。
#     そこで別名のサービス(studio-acc / ohmycms-studio-acc)を足し、
#     **既存の db サービスをそのまま再利用**する。down -v はしない。
#     → 他ペインのスタックを止めずに基準8・9 を判定できる。
#
# 🚨 これは開発ビルドなので、**本番ビルドでも同じ結果になるかは別の話**。
#    ハーネスの出力にもその旨を出している。本番ビルドでの確認は infra の F0c/F0d と
#    F9 の総合受入で改めて行う。
#
# 使い方（run.mjs が叩く。手で試すときは下記）:
#   docker compose -f compose.yml -f acceptance/compose.acceptance.yml up -d studio-acc
#   docker compose -f compose.yml -f acceptance/compose.acceptance.yml down studio-acc

services:
  studio-acc:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: devserver
      args:
        # 🚨 studio-acc は COPY . . でビルド時のコードを焼き込む（マウントではない）ので、
        #    リポジトリの HEAD と中身が一致するとは限らない。
        #    /api/version が「対象の版」を名乗れるように、焼いた版を渡す。
        #    値が渡っていなければ unknown。**不明を「一致」と読まないこと**（sdk の指摘）。
        GIT_SHA: ${GIT_SHA:-unknown}
    image: ohmycms-studio-acc
    container_name: ohmycms-studio-acc
    user: root
    working_dir: /app/apps/studio
    # 🚨 **公開ポートとコンテナ内のポートを必ず一致させる（3103:3103）。**
    #    lib/admin/api.ts の requestOrigin() は host ヘッダから自分の URL を組み立てて
    #    サーバ側から自分の API を叩く。3999:3000 のように食い違わせると、
    #    コンテナ内で localhost:3999 へ繋ごうとして ECONNREFUSED になり、
    #    **管理画面が全部 500 になる**（実測。ブラウザからは何をしても開けない）。
    #    curl に x-forwarded-host を付ければ回避できるが、ブラウザには付けられない。
    # 🚨 `npx` はベースイメージ（oven/bun）に**存在しない**。bun 移行で npm/npx が消えた
    #    （実測: npx も npm も無し / bun と node shim だけがある）。`bun x` で next を起動する。
    # 🚨 **`next dev` は Node で動かす。bun では動かない**（実測）。
    #    Turbopack の dev サーバは serverExternalPackages(knex/pg/sharp) を
    #    ハッシュ付きの内部名で externalRequire するが、bun のリゾルバが解決できない:
    #      Failed to load external module knex-6f520bbc368ae347: Cannot find package ...
    #    → /api/health も管理画面も 500 になる。
    #    本番ビルド(runner)は next build のファイルトレースが実体を運ぶので無事。
    #    そのため target を devserver（Node 入り・出荷物ではない）にしている。
    command: ["node", "node_modules/next/dist/bin/next", "dev", "--hostname", "0.0.0.0", "--port", "3103"]
    ports:
      # ポート規約 knowledge/decisions/port-allocation.md:
      #   本番(Docker) 3101 / dev 3102 / **受入ハーネス 3103** / Storybook 3104 / DB 5436
      - "3103:3103"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cms}:${POSTGRES_PASSWORD:-cms}@db:5432/${POSTGRES_DB:-cms}
      # 受入基準8・9 の検証にセッションが要るため。**本番では絶対に設定しない。**
      ALLOW_DEV_LOGIN: "true"
      # 🚨 焼き込んだコードの版。ハーネスが「対象がどの版か」を言うために要る
      #   （リポジトリの HEAD は対象の版ではない。焼き直すまで古いままなので）
      # 🚨 既定を空にすると、Dockerfile の ENV（ビルド時に焼いた版）を**空で上書きしてしまう**。
      # 実測: イメージには値が入っているのにコンテナでは空、という状態になっていた。
      # GIT_SHA へ繋いで、無ければ unknown。**「不明」を「一致」と読まないこと**（sdk の指摘）。
      OHMYCMS_GIT_COMMIT: ${OHMYCMS_GIT_COMMIT:-${GIT_SHA:-unknown}}
      # トラックA のストレージ(ohmycms-storage)を汚さないよう、別の場所へ吐かせる。
      STORAGE_LOCAL_ROOT: /app/.storage-acceptance
      OHMYCMS_DEFAULT_LOCALE: ${OHMYCMS_DEFAULT_LOCALE:-}
      OHMYCMS_PROJECT_NAME: ${OHMYCMS_PROJECT_NAME:-}
      # 不具合報告のメール送信を検証したいときだけ値を入れる。
      # 空のままなら送信はスキップされる（それが既定の正しい状態）。
      OHMYCMS_BUGREPORT_TO: ${OHMYCMS_BUGREPORT_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      # 更新確認の検証用。空なら外部へ一切通信しない（受入基準9）。
      OHMYCMS_UPDATE_FEED_URL: ${OHMYCMS_UPDATE_FEED_URL:-}
      # ── V1-B ストレージ（S3 互換）の検証用 ──
      # 🚨 **既定は空**。空なら studio-acc はローカル FS のまま動く。
      #   ここを常時 S3 にすると、**MinIO が落ちている日に v0.9 の基準9 まで巻き込まれる**。
      #   飾りのために本体を落とさないのと同じ考え方で、**V1-B のときだけ差し込む**。
      # 使い方（MinIO を立ててから studio-acc を作り直す）:
      #   docker compose -p ohmycms-verify -f compose.minio.yml up -d
      #   S3_ENDPOINT=http://minio:9000 S3_BUCKET=ohmycms \
      #   S3_ACCESS_KEY_ID=minioadmin S3_SECRET_ACCESS_KEY=minioadmin \
      #   S3_REGION=us-east-1 S3_FORCE_PATH_STYLE=true \
      #   docker compose -f compose.yml -f acceptance/compose.acceptance.yml up -d studio-acc
      # 🚨 コンテナ内からは `localhost:3106` ではなく **`minio:9000`**（compose のホスト名）。
      #   ネットワークは compose.minio.yml が ohmycms_default へ相乗りしている（storage の実測）。
      #
      # 🚨 **env だけでは足りない。DB も見ること**（2026-08-17・storage の実測）。
      #   設定は **DB が正で、env は初期値**（`lib/settings/service.ts` の `fromEnvironment`）。
      #   **DB に値が入っていると env は無視される**ので、下を必ず打つ:
      #     docker exec ohmycms-db psql -U cms -d cms -c \
      #       "update ohmycms_settings set s3_force_path_style='true'"
      #   🚨 打たないとどうなるか（実測）: `S3_FORCE_PATH_STYLE=true` を渡していても
      #     DB の `'false'` が勝ち、**virtual-host 形式**で `ohmycms.minio` を引きに行って
      #     **502 STORAGE_ERROR (Error code=ENOTFOUND)**。
      #     🟢 対照 `minio` は引ける（172.28.0.4）ので、**台のせいに見えない**。
      #   🚨 **終わったら `'false'` へ戻すこと**（共有 DB なので、次に使う人の前提が変わる）。
      #   詳しくは `knowledge/decisions/settings-db-beats-env.md`。
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-}
    depends_on:
      db:
        condition: service_healthy
