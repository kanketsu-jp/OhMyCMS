name: CI

# push では動かさない。まだリモートへ push しておらず、無駄な実行と課金を避けるため。
# 必要になったら workflow_dispatch で手動実行できる。
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: 秘密の混入検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: .env 系が追跡されていないこと
        run: |
          # .env.example 以外の .env 系・鍵ファイルが git 管理下に無いことを見る。
          tracked=$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|\.pem$|\.p12$|\.key$' \
            | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::秘密の可能性があるファイルが追跡されています"
            echo "$tracked"
            exit 1
          fi
          echo "追跡されている .env 系は .env.example のみ（OK）"

      - name: .gitignore が .env を無視していること
        run: |
          # 「.gitignore から .env* が消えていた」を検知する。
          printf 'DUMMY=1\n' > .env
          if git check-ignore -q .env; then
            echo ".env は .gitignore されている（OK）"
          else
            echo "::error::.env が .gitignore されていません"
            exit 1
          fi
          rm -f .env

  build:
    name: ビルドと lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: 型チェック
        run: pnpm --filter @ohmycms/studio exec tsc --noEmit

      - name: build
        # lib/db/knex.ts が module 直下で DATABASE_URL を読むため、
        # ビルドを通すためだけのダミーを渡す（接続はしない。docker/Dockerfile と同じ扱い）。
        env:
          DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
        run: pnpm build

  docker:
    name: Docker で起動して /api/health が 200
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ランナーが amd64 であること
        # GitHub ホストの ubuntu-latest は amd64。デプロイ先の VPS(Dokploy) も amd64 なので、
        # この job は **エミュレーション無しの本物の amd64 検証**になる。
        # ここが x86_64 でなくなったら、以降の「amd64 で動く」という主張が崩れるので先に落とす。
        run: |
          arch=$(uname -m)
          echo "runner arch: $arch"
          [ "$arch" = "x86_64" ] || { echo "::error::ランナーが amd64 ではありません: $arch"; exit 1; }

      - name: .env を用意して起動
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: /api/health が 200 になるまで待つ
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || true)
            echo "試行 $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::/api/health が 200 になりませんでした"
          docker compose logs --no-color | tail -100
          exit 1

      - name: マイグレーションが流れたこと
        run: docker compose logs migrate --no-color | tail -20

      - name: sharp が動くこと（回帰ガード）
        # 実際に踏んだ壊れ方: next build のファイルトレースがバインディングの .node は運ぶのに、
        # それがリンクする libvips-cpp.so を運ばず、ファイルのアップロードと画像変換が 500 になった。
        # /api/health は DB しか見ないのでこれを検知できない。ここで require まで通す。
        run: |
          docker compose exec -T studio node -e '
            const s = require("sharp");
            console.log("sharp OK / libvips", s.versions.vips);
          '
          so=$(docker compose exec -T studio sh -c 'find /app/node_modules -name "libvips-cpp*" | wc -l')
          echo "同梱されている libvips-cpp: $so 件"
          [ "$so" -ge 1 ] || { echo "::error::libvips の共有ライブラリがイメージに入っていません"; exit 1; }

      - name: 非 root で動いていること
        run: |
          id_out=$(docker compose exec -T studio id)
          echo "$id_out"
          echo "$id_out" | grep -q 'uid=0(root)' && { echo "::error::root で動いています"; exit 1; }
          echo "非 root（OK）"

      - name: イメージに .env 系が入っていないこと
        run: |
          out=$(docker compose run --rm --no-deps --entrypoint sh studio -c 'ls -a /app' || true)
          echo "$out"
          echo "$out" | grep -qE '^\.env' && { echo "::error::イメージに .env 系が入っています"; exit 1; }
          echo "イメージに .env 系なし（OK）"

      - name: 後始末
        if: always()
        run: docker compose down -v

  image:
    name: デプロイ用 amd64 イメージを焼く
    # PR ごとには回さない。docker job が同じものを既に amd64 で建てて 200 まで確認しているので、
    # ここで毎回焼くと CI 時間の二重払いになる。配布物が要るときだけ手動で回す。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: linux/amd64 で単アーキのイメージを焼く
        # マルチアーキの manifest は作らない。デプロイ先は VPS(Dokploy) の amd64 だけで、
        # multi-arch にすると QEMU ビルドで所要時間が数倍になる割に、得るものが
        # ローカル Mac(arm64) の利便性しかない。ローカルは compose が自前でネイティブに建てる。
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f docker/Dockerfile \
            -t ohmycms-studio:${{ github.sha }} \
            --load .

      - name: 焼いたイメージが amd64 で、sharp まで動くこと
        run: |
          arch=$(docker run --rm --entrypoint uname "ohmycms-studio:${{ github.sha }}" -m)
          echo "image arch: $arch"
          [ "$arch" = "x86_64" ] || { echo "::error::amd64 になっていません: $arch"; exit 1; }
          docker run --rm --entrypoint node "ohmycms-studio:${{ github.sha }}" -e '
            const s = require("sharp");
            console.log("sharp OK / libvips", s.versions.vips);
          '

      - name: イメージを tar にして成果物として出す
        # レジストリはまだ決まっていないため、当面は成果物として持ち出せるようにしておく。
        # 決まったら docker/login-action + push に差し替える。
        run: docker save "ohmycms-studio:${{ github.sha }}" -o /tmp/ohmycms-studio-amd64.tar

      - uses: actions/upload-artifact@v4
        with:
          name: ohmycms-studio-amd64
          path: /tmp/ohmycms-studio-amd64.tar
          retention-days: 7
