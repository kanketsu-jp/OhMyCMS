name: CI

# 🚨 **2026-08-16 まで `push` が無く、CI は一度も走っていなかった**（実測: workflow run の総数 = 0。
# workflow は state=active、Actions も enabled=true、同じ鍵で repo も commit も読めたので
# 「見えていない 0」ではない）。元のコメントは「まだリモートへ push しておらず」だったが、
# その前提はもう成り立っていない——押されており、`main` は本番へ自動デプロイされる。
# PR を開かない運用なので `pull_request` は永久に発火せず、検査を守っているのは lefthook だけだった
# （`--no-verify` で素通りできる／**手元にしか無いファイルへの依存は、手元では永遠に緑**）。
#
# 🚨 **`main` への push で走らせるのは「他人の環境で動くか」を見るため。**
# CI は追跡されているファイルしか持たないので、未追跡ファイルへの依存はここでだけ落ちる。
#
# 🚨 **これはデプロイの門ではない。** Dokploy は GitHub Actions の結果を見ていないので、
# ここが赤くても本番へは出る。止めたいなら別の仕組みが要る。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: 秘密の混入検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: .env 系が追跡されていないこと
        run: |
          # .env.example 以外の .env 系・鍵ファイルが git 管理下に無いことを見る。
          tracked=$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|\.pem$|\.p12$|\.key$' \
            | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::秘密の可能性があるファイルが追跡されています"
            echo "$tracked"
            exit 1
          fi
          echo "追跡されている .env 系は .env.example のみ（OK）"

      - name: .gitignore が .env を無視していること
        run: |
          # 「.gitignore から .env* が消えていた」を検知する。
          printf 'DUMMY=1\n' > .env
          if git check-ignore -q .env; then
            echo ".env は .gitignore されている（OK）"
          else
            echo "::error::.env が .gitignore されていません"
            exit 1
          fi
          rm -f .env

  checks:
    # 🚨 lefthook の検査を CI でも走らせる（2026-08-15・schema）。
    #    実測: これを足すまで **CI は lefthook の 19 本を1つも走らせていなかった**
    #    （`ci.yml` の `check-` は `git check-ignore` の1件・`lefthook` はコメント1件だけ）。
    #    そして開発者の PC 側も、`node_modules` に lefthook が無いと
    #    `Can't find lefthook in PATH` の1行を出して **exit 0 で通る**（フックを /tmp へ複製して実測）。
    #    ＝ **検査が「どこでも走っていない」状態が作れてしまう**ので、押した先で必ず走る場所に置く。
    # 🚨 一覧をここに書かない。`lefthook.yml` が唯一の正のままにして、
    #    **足した検査が自動で CI にも載る**ようにする（二重管理にすると必ず片方が腐る）。
    # 実測（ローカル）: `bunx lefthook run pre-commit --all-files` → exit 0 / 5 秒 / 21 項目すべて ✔️
    #
    # 🚨 **この CI が見ていない範囲**（守り手を書く人は、穴も書く）:
    #   1. **デプロイを止めない** … Dokploy は Actions の結果を見ていない。**赤くても本番へ出る**
    #   2. **DB が要る検査は入っていない** … `verify:fixtures`（常設 fixture の生存確認）は
    #      ここに無い。🚨 **入れても意味が無い**——常設 fixture は migrations が作らないので
    #      （実測: `zz_probe_actions` / `zz_probe_dialog` / `acc_748015_pl` は migrations に **0 件**。
    #      対照: `directus_fields` は 1 件）、**まっさらな CI の DB には最初から存在しない**。
    #      入れると初日から赤くなる。**先に「fixture を migrations か seed で作る」を決める必要がある**
    #   3. **ブラウザで見ていない** … 描画・読み上げ・押した手応えは別（`docker` ジョブは
    #      `/api/health` が 200 になるところまで）
    #   4. **`--no-verify` で押された commit も、ここでは走る**が、**押される前には誰も止めない**
    name: リポジトリの検査（lefthook）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # 🚨 **これが無いと `packages-typecheck` が必ず落ちる**（2026-08-16 実測）。
      #    手元には `packages/sdk/dist` が残っているので気づかないが、**新しい clone には無い**。
      #    実測: clone して install しただけで lefthook を回すと exit 1
      #      「🚨 packages/sdk/dist がありません。**この検査は何も測れていません**」
      #    ビルドしてから回すと **exit 0 / 23 ジョブ**。
      #    ＝ CI は「他人の環境」なので、手元にしか無いものへの依存はここで初めて出る。
      - name: packages のビルド（dist が無いと型検査が測れない）
        run: bun --filter './packages/*' build

      - name: pre-commit の検査を全ファイルへ
        run: bun x lefthook run pre-commit --all-files

  build:
    name: ビルドと lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: lint
        run: bun run lint

      - name: 型チェック
        # 🚨 bun の --filter は pnpm と違い exec を受け付けない
        #    （"No packages matched the filter" になる。lefthook で実際に踏んだ）。
        #    cd してから bun x で直接叩く。
        working-directory: apps/studio
        run: bun x tsc --noEmit

      - name: packages の型チェック
        # 🚨 apps/studio の tsc は packages/ を見ない。
        #    実測: packages/sdk に型エラーを1行入れても
        #      cd apps/studio && bun x tsc --noEmit → exit 0（気づけない）
        #      bun --filter './packages/*' typecheck → exit 2（気づける）
        #    SDK/CLI/MCP が壊れても CI が緑になる状態だった（sdk が発見・infra が再実測）。
        run: bun --filter './packages/*' typecheck

      - name: packages のビルド
        # dist は .gitignore なので clone 直後は必ず存在しない。
        # 「ビルドが通ること」自体を検査する（受入ハーネスも判定前に必ずビルドする）。
        # sdk → cli/mcp の依存順は bun が守る。
        run: bun --filter './packages/*' build

      - name: build
        # lib/db/knex.ts が module 直下で DATABASE_URL を読むため、
        # ビルドを通すためだけのダミーを渡す（接続はしない。docker/Dockerfile と同じ扱い）。
        env:
          DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
        run: bun run build

  docker:
    name: Docker で起動して /api/health が 200
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ランナーが amd64 であること
        # GitHub ホストの ubuntu-latest は amd64。デプロイ先の VPS(Dokploy) も amd64 なので、
        # この job は **エミュレーション無しの本物の amd64 検証**になる。
        # ここが x86_64 でなくなったら、以降の「amd64 で動く」という主張が崩れるので先に落とす。
        run: |
          arch=$(uname -m)
          echo "runner arch: $arch"
          [ "$arch" = "x86_64" ] || { echo "::error::ランナーが amd64 ではありません: $arch"; exit 1; }

      - name: .env を用意して起動
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: /api/health が 200 になるまで待つ
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || true)
            echo "試行 $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::/api/health が 200 になりませんでした"
          docker compose logs --no-color | tail -100
          exit 1

      - name: マイグレーションが流れたこと
        run: docker compose logs migrate --no-color | tail -20

      - name: sharp が動くこと（回帰ガード）
        # 実際に踏んだ壊れ方: next build のファイルトレースがバインディングの .node は運ぶのに、
        # それがリンクする libvips-cpp.so を運ばず、ファイルのアップロードと画像変換が 500 になった。
        # /api/health は DB しか見ないのでこれを検知できない。ここで require まで通す。
        run: |
          docker compose exec -T studio bun -e '
            const s = require("sharp");
            console.log("sharp OK / libvips", s.versions.vips);
          '
          so=$(docker compose exec -T studio sh -c 'find /app/node_modules -name "libvips-cpp*" | wc -l')
          echo "同梱されている libvips-cpp: $so 件"
          [ "$so" -ge 1 ] || { echo "::error::libvips の共有ライブラリがイメージに入っていません"; exit 1; }

      - name: 非 root で動いていること
        run: |
          id_out=$(docker compose exec -T studio id)
          echo "$id_out"
          echo "$id_out" | grep -q 'uid=0(root)' && { echo "::error::root で動いています"; exit 1; }
          echo "非 root（OK）"

      - name: イメージに .env 系が入っていないこと
        run: |
          out=$(docker compose run --rm --no-deps --entrypoint sh studio -c 'ls -a /app' || true)
          echo "$out"
          echo "$out" | grep -qE '^\.env' && { echo "::error::イメージに .env 系が入っています"; exit 1; }
          echo "イメージに .env 系なし（OK）"

      - name: 後始末
        if: always()
        run: docker compose down -v

  image:
    name: デプロイ用 amd64 イメージを焼く
    # PR ごとには回さない。docker job が同じものを既に amd64 で建てて 200 まで確認しているので、
    # ここで毎回焼くと CI 時間の二重払いになる。配布物が要るときだけ手動で回す。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: linux/amd64 で単アーキのイメージを焼く
        # マルチアーキの manifest は作らない。デプロイ先は VPS(Dokploy) の amd64 だけで、
        # multi-arch にすると QEMU ビルドで所要時間が数倍になる割に、得るものが
        # ローカル Mac(arm64) の利便性しかない。ローカルは compose が自前でネイティブに建てる。
        # 🚨 **`--build-arg GIT_DIRTY=0` を渡さない。**
        # 渡すと「汚れていない」と**宣言している**だけで、**このツリーについて何も測っていない**。
        # Dockerfile の gitinfo ステージは文脈の中で `git status --porcelain` を回して自分で判定し、
        # 判定できたときは外から来た値を**必ず上書きする**ので、渡す意味も無い。
        # 判定できなかったときは `unknown` が出る——**それが正しい**（`0` は嘘、`unknown` は「見ていない」）。
        # 検査: apps/studio/scripts/check-build-info-guards.mjs（このファイルが GIT_DIRTY を渡していないこと）
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f docker/Dockerfile \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t ohmycms-studio:${{ github.sha }} \
            --load .

      - name: 焼いたイメージが amd64 で、sharp まで動くこと
        run: |
          arch=$(docker run --rm --entrypoint uname "ohmycms-studio:${{ github.sha }}" -m)
          echo "image arch: $arch"
          [ "$arch" = "x86_64" ] || { echo "::error::amd64 になっていません: $arch"; exit 1; }
          docker run --rm --entrypoint bun "ohmycms-studio:${{ github.sha }}" -e '
            const s = require("sharp");
            console.log("sharp OK / libvips", s.versions.vips);
          '

      - name: イメージを tar にして成果物として出す
        # レジストリはまだ決まっていないため、当面は成果物として持ち出せるようにしておく。
        # 決まったら docker/login-action + push に差し替える。
        run: docker save "ohmycms-studio:${{ github.sha }}" -o /tmp/ohmycms-studio-amd64.tar

      - uses: actions/upload-artifact@v4
        with:
          name: ohmycms-studio-amd64
          path: /tmp/ohmycms-studio-amd64.tar
          retention-days: 7
