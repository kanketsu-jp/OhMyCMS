# コミット前チェック。
#
# 方針: pre-commit に置くのは「速いもの」だけ。遅いと必ず --no-verify されて意味を失う。
# 実測（2026-08-13・このPC）:
#   tsc --noEmit  2.6 秒  → pre-commit に入れる
#   eslint        数秒    → 変更された apps/studio のファイルだけに絞る
# 秘密の混入検査とナレッジ鮮度検査は 1 秒未満。

pre-commit:
  parallel: true
  commands:
    # 秘密の混入。.gitignore を git add -f で越えてきた場合の最後の歯止め。
    secrets:
      run: bash .lefthook/no-secrets.sh {staged_files}

    # 変更された apps/studio のファイルだけ lint する。
    # root を指定すると {staged_files} がそのディレクトリ基準の相対パスになる。
    lint:
      root: "apps/studio"
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: bun x eslint {staged_files}

    # 型は全体で見る（部分的な tsc は型エラーを取りこぼす）。
    # 🚨 bun の --filter は pnpm と違い exec を受け付けない（"No packages matched the filter" で
    # 落ちる）。root を指定して、そのディレクトリで直接 tsc を走らせる。実測 1.95 秒。
    typecheck:
      root: "apps/studio"
      glob: "*.{ts,tsx}"
      run: bun x tsc --noEmit

    # i18n（AGENTS.md §3.8 の CRITICAL）。3本まとめて 0.15 秒未満（2026-08-14 実測）なので
    # pre-commit の「速いものだけ」方針に収まる。全体を見る検査（keys/usage は辞書集合の一致を
    # 見るため staged_files に絞れない）なので glob は付けず毎回走らせる。
    #   hardcoded … 日本語・英語のハードコード（素の grep でなく専用検査。誤検出と英語見逃しを防ぐ）
    #   keys      … ja / en のキー集合一致
    #   usage     … コードが呼ぶキーと辞書の突き合わせ（両方向）
    i18n:
      root: "apps/studio"
      run: node scripts/check-i18n-hardcoded.mjs && node scripts/check-i18n-keys.mjs && node scripts/check-i18n-usage.mjs

    # 内部専用の固定ユーザー（local-admin@localhost）が画面のラベルへ届かないこと。
    # 一度実際に左サイドバーへ出た（2026-08-15）。**直しただけだと必ず戻る**ので検査で留める。
    # 🚨 この検査は走るたびに「自分が検出できること」を2通りの壊し方で証明してから判定を出す
    #    （緑が「異常が無い」なのか「見ていない」なのかを区別できるようにするため）。
    userlabel:
      root: "apps/studio"
      run: node scripts/check-user-label-leak.mjs

    # ナレッジ索引の鮮度。**警告のみでコミットは止めない**（理由はスクリプト内）。
    knowledge:
      run: bash .lefthook/rokf-doctor.sh
