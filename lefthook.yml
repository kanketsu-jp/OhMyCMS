# コミット前チェック。
#
# 方針: pre-commit に置くのは「速いもの」だけ。遅いと必ず --no-verify されて意味を失う。
# 実測（2026-08-13・このPC）:
#   tsc --noEmit  2.6 秒  → pre-commit に入れる
#   eslint        数秒    → 変更された apps/studio のファイルだけに絞る
# 秘密の混入検査とナレッジ鮮度検査は 1 秒未満。
#
# 🚨 **`root:` を書いた検査は「毎回走る」ではない**（2026-08-16 実測）。
#    staged に `root` 配下のファイルが 1 つも無いコミットでは **(skip) で緑**になる。
#    実測: lefthook.yml だけを staged にしてコミットした結果
#      root 在り 20 本 → **全部 skip**  ／  root 無し 7 本 → 全部走った
#      （root 無しで skip された 1 本は `syntax`。こちらは glob で外れた別の理由）
#    ＝ `glob:` を書かなければ毎回走る、ではない。**`root:` だけでも絞られる。**
#    🚨 したがって「門で確かめた」と言うときは、**root 配下を staged にしたコミット**か
#      `bun x lefthook run pre-commit --all-files` で確かめること。
#      素の `lefthook run pre-commit` は staged が無いと (skip) で緑になる。

pre-commit:
  parallel: true
  commands:
    # 秘密の混入。.gitignore を git add -f で越えてきた場合の最後の歯止め。
    secrets:
      run: bash .lefthook/no-secrets.sh {staged_files}

    # 変更された apps/studio のファイルだけ lint する。
    # root を指定すると {staged_files} がそのディレクトリ基準の相対パスになる。
    lint:
      root: "apps/studio"
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: bun x eslint {staged_files}

    # 型は全体で見る（部分的な tsc は型エラーを取りこぼす）。
    # 🚨 bun の --filter は pnpm と違い exec を受け付けない（"No packages matched the filter" で
    # 落ちる）。root を指定して、そのディレクトリで直接 tsc を走らせる。実測 1.95 秒。
    typecheck:
      root: "apps/studio"
      glob: "*.{ts,tsx}"
      run: bun x tsc --noEmit

    # i18n（AGENTS.md §3.8 の CRITICAL）。4本まとめて 0.14〜0.23 秒（2026-08-16 実測・3 回）なので
    # pre-commit の「速いものだけ」方針に収まる（4 本目を足して +0.02〜0.11 秒）。
    # 全体を見る検査（keys/usage/placeholders は辞書集合の一致を見るため staged_files に絞れない）
    # なので glob は付けない。
    # 🚨 ただし **`root:` があるので「毎回」ではない**（冒頭の注記）。apps/studio の外だけを
    #    触るコミット（lefthook.yml / knowledge/ / packages/ など）では走らない。
    #    辞書もコードも apps/studio の中に在るので実害は無いが、**走ったと思い込まないこと。**
    #   hardcoded … 日本語・英語のハードコード（素の grep でなく専用検査。誤検出と英語見逃しを防ぐ）
    #   keys      … ja / en のキー集合一致
    #   usage     … コードが呼ぶキーと辞書の突き合わせ（両方向）
    #   placeholders … 🚨 **キーが揃っていても中身が食い違う**のを見る（{name} の不一致・空）
    #      🚨 この検査は「訳の意味が同じか」は**見ていない**（先頭の JSDoc に明記）。
    #         設問290 で ja / en を直すときは、**人が両方を読むこと**
    i18n:
      root: "apps/studio"
      run: node scripts/check-i18n-hardcoded.mjs && node scripts/check-i18n-keys.mjs && node scripts/check-i18n-usage.mjs && node scripts/check-i18n-placeholders.mjs

    # 🚨 画面が **API の生文言をそのまま表示していないか**。**名前でなく振る舞い**で見る。
    # 由来: 「apiMessage() の呼び出しが 0 件だから生文言は出ない」と決定に書いたが誤りだった。
    #   同じ振る舞いが messageFrom() という**別名で 12 ファイル**に在った（storage が発見）。
    #   その文言は lib/ の日本語リテラルなので、**英語で見ている人の画面に日本語が出る**
    #   （saml が偽の 404 を返して画面で実証）。**識別子 1 つを見る検査では逃げられる。**
    # 🚨 これは「減らす検査」ではなく「**増やさない**検査」。既存 12 ファイルを赤にすると
    #   全員が門を回避し始めるので、**2026-08-16 の実測を基準線**にして増加だけ落とす。
    #   直すたびにスクリプト内の BASELINE から削る（減ったら緑のまま「削れ」と言う）。
    raw-api-message:
      root: "apps/studio"
      run: node scripts/check-raw-api-message.mjs

    # 内部専用の固定ユーザー（local-admin@localhost）が画面のラベルへ届かないこと。
    # 一度実際に左サイドバーへ出た（2026-08-15）。**直しただけだと必ず戻る**ので検査で留める。
    # 🚨 この検査は走るたびに「自分が検出できること」を2通りの壊し方で証明してから判定を出す
    #    （緑が「異常が無い」なのか「見ていない」なのかを区別できるようにするため）。
    userlabel:
      root: "apps/studio"
      run: node scripts/check-user-label-leak.mjs

    # パンくずの読み上げ名が、見えている文字（ページ名）から作られていること。
    # 🚨 この約束だけは、破っても画面から見えない（読み上げ名だけが静かに壊れる）。
    #    他の「〜しない」は破れば線が出る・薄くなる・ボタンになるので目で足りるが、ここは足りない。
    #    2026-08-15 に AX ツリーで「読み上げ名にスラッシュが入っていない」ことを確かめた状態を留める。
    # 🚨 対象（引き金の <Button>）を見つけられないときも落とす。
    #    見つからないまま通すと「何も見ていない緑」になるため（RED を3通りで実測済み）。
    breadcrumba11y:
      root: "apps/studio"
      run: node scripts/check-breadcrumb-a11y.mjs

    # 🚨 効かない `readOnly`（checkbox / radio / select に付いているもの）。
    #    2026-08-16 に本物のキーとクリックを送って測った: checkbox と radio は
    #    属性が付いて el.readOnly が true になるのに実クリックで変わる。select は
    #    そもそも readOnly という性質を持たない（'readOnly' in el が false ＝ div と同じ）。
    # 🚨 付いているのに効かないと、画面は止まっているように見えて実際は変えられる。
    #    権限で出し分けている画面なら AGENTS.md §3.5 の形に化ける。
    # 🚨 対象が 0 ファイルのときも落とす（「探せていない 0」を緑にしないため）。
    readonly-misuse:
      root: "apps/studio"
      run: node scripts/check-readonly-misuse.mjs

    # 「名前空間つきの完全な辞書キー」を、名前空間を付ける翻訳関数へ渡していないか。
    # 一度これで画面に "panel.reports.create_title" というキー文字列が出る状態になった（2026-08-15）。
    # 🚨 **辞書の突き合わせ（i18n の3本）では捕まらない**。キーは実在していて、引き方が違うだけなので
    #    静的な突き合わせは全部緑になる。捕まえられるのは「どの翻訳関数へ渡したか」を見るこれだけ。
    qualifiedkeys:
      root: "apps/studio"
      run: node scripts/check-qualified-keys.mjs

    # ログイン画面に SAML の入口を作ったら、断りの文言の鍵も一緒に足させる。
    # 🚨 いまは入口が 0 件なので**何も止めない**。入口を作った人の手元で、その瞬間に落ちる。
    #    由来: 設問 292 A（transient を断る）。表示する画面が無いので鍵を先に足さない判断をした
    #    （i18n/error.ts に「呼び手が無い鍵を足して取り消した」記録が在るため）。
    saml-entry-key:
      root: "apps/studio"
      run: node scripts/check-saml-entry-needs-key.mjs

    # ショートカットの被り（堀池「ショートカットは被ってはいけない」）。
    # 🚨 走るたびに囮を2つ仕込んで検出できることを確かめ、拾えた件数も出す
    #    （「被りが無いから緑」と「拾えていないから緑」を区別するため）。
    shortcuts:
      root: "apps/studio"
      run: node scripts/check-shortcuts.mjs

    # PC のサイドバーと SP のドロワーへ、同じ prop を渡しているか。
    # 🚨 **2026-08-16 まで、この検査は門に載っていなかった**（lefthook にも他のどこにも 0 件）。
    #    自己検査まで足してあるのに、手で叩かない限り一度も走らない状態だった
    #    ——「一度も通っていない経路」の検査版。**緑だったが、門は守っていなかった。**
    # 🚨 走るたびに壊し方を3通り（片側のみ×両方向 / spread）と、
    #    誤検出しないことの対照を1本、その場で確かめてから判定を出す。
    # 🚨 `root:` 配下に staged が 1 つも無いコミットでは**飛びます**（glob の有無に関係なく）。
    #    例: lefthook.yml / knowledge/ / packages/ だけを触るコミット。
    #    飛んだことは出力に `(skip) no matching staged files` と出るので、黙って通ることはない。
    #    🚨 **「コミットが緑だった」は「この検査が通った」を意味しません。** 迷ったら --all-files。
    nav-parity:
      root: "apps/studio"
      run: node scripts/check-nav-parity.mjs

    # アクションボタンの宣言（lib/admin/page-actions.ts）が実在するものを指しているか。
    # 🚨 **2026-08-16 まで、この 2 本は門にもどこにも載っていなかった**
    #    （lefthook 0 件・autopilot の門にも無し・リポジトリ内の実行者 0 件。実測）。
    #    未追跡だった strip-comments.mjs に依存していたのが理由だが、
    #    **それが追跡済みになった後も、載せ直されていなかった。**
    #    外している理由はどちらのファイルにも書かれていなかったので、**穴と判定して載せる。**
    # 🚨 rendered のほうは「宣言が正しい」ではなく「宣言どおり画面に出ているか」を見る。
    #    実際に、宣言はあるのに <PageAction> を描いていない画面が 2 枚あった（2026-08-15）
    #    ＝ **保存ボタンがどこにも無いのに緑**だった。
    # 🚨 `root:` 配下に staged が 1 つも無いコミットでは**飛びます**（glob の有無に関係なく）。
    #    例: lefthook.yml / knowledge/ / packages/ だけを触るコミット。
    #    飛んだことは出力に `(skip) no matching staged files` と出るので、黙って通ることはない。
    #    🚨 **「コミットが緑だった」は「この検査が通った」を意味しません。** 迷ったら --all-files。
    page-actions:
      root: "apps/studio"
      run: node scripts/check-page-actions.mjs

    # 🚨 `root:` 配下に staged が 1 つも無いコミットでは**飛びます**（glob の有無に関係なく）。
    #    例: lefthook.yml / knowledge/ / packages/ だけを触るコミット。
    #    飛んだことは出力に `(skip) no matching staged files` と出るので、黙って通ることはない。
    #    🚨 **「コミットが緑だった」は「この検査が通った」を意味しません。** 迷ったら --all-files。
    page-actions-rendered:
      root: "apps/studio"
      run: node scripts/check-page-actions-rendered.mjs

    # API の生文言を画面へ出す経路（apiMessage）が戻ってこないための見張り。
    # 🚨 i18n ではなく**なりすまし**の話——?error= は利用者が自由に書けるので、
    #    生文言を載せると細工したリンクで任意の文章を公式のエラー枠に出せる。
    #    関数は 2026-08-15 に削除済み。**無いと次の人が作り直す**ので機械で見る。
    # 🚨 **2026-08-15 いったん外している。** 名前（apiMessage）だけを見ていた検査を
    #    「形」でも見るようにしたところ、**同じ働きの別名が 10 ファイルで生きていた**ことが分かった
    #    （messageFrom という名前で 9 本 ＋ file-picker.tsx に 1 本。**名前で数えると 1 本漏れる**）。
    #    載せたままだと**全員のコミットが即座に止まる**ので、
    #    **toast が 10 箇所を apiErrorKey() へ寄せ終えてから戻す**。
    #    🚨 **【2026-08-16 解消。戻した】** 寄せ終えた（実際は 10 ではなく **22 箇所 / 12 ファイル**
    #       だった。`?.` の 2 件を名前で数えて落としていた）。`raw-api-message` が
    #       **0 件 / 0 ファイル**になり、外した理由が消えたので下の 3 行を戻した。
    #       **この段落は消さずに残す**——なぜ一度外れたかが、戻したあとに分からなくなるため。
    #
    # 🚨 外している検査は、規律13 の 4 項目を持つこと（司令塔 2026-08-15）。
    #    ① 記録  2026-08-15
    #    ② 状態  🚨 **解消（2026-08-16 戻した・toast）**。以前は「未決（外したまま）」
    #    ③ 決める人  toast(w4A:p25)。10 箇所を apiErrorKey() へ寄せる担当
    #    ④ 何を決めるか  10 箇所の置き換えが済んだかどうか。済んだら**この 3 行のコメントを外す**
    #    🚨 **外したことを忘れないために、状態を「未決」と書いてある。**
    #       「理由が書いてある」だけでは、次の人が「もう要らないのかも」と読む。
    # 🚨 2026-08-16 に門へ戻した（toast）。外した理由（画面側の 10 箇所が生きていた）は
    #    `raw-api-message` が **0 件 / 0 ファイル**になったことで消えた。
    #    戻す前に、**この検査が本当に落とせること**を台で確かめた:
    #      🔴 `components/ui/toast.tsx` に `apiMessage(res)` を 1 行足す → **違反 1 件・exit 1**
    #      🚨 1 回目は `lib/admin/api.ts` に置いて**鳴らなかった**——この検査の範囲は
    #         `app/** / components/**` で、**lib/ は見ていない**（範囲の外に囮を置いていた）
    #      🟢 素の状態 … exit 0（自己検査の囮 1〜4 も全部 ✅）
    no-api-message:
      root: "apps/studio"
      run: node scripts/check-no-api-message.mjs

    # 🚨 **まだ一度も載せていない検査**（scripts/check-control-height-tokens.mjs）。
    #    操作部品の高さを素の数字（h-8 等）で書いていないかを見る。
    #    「app/globals.css がここが唯一の定義場所」「素の h-8 を書き戻さない」と
    #    2 箇所に書いてあったのに、**止めるものが無かった**ので作った（規律12）。
    #    ① 記録  2026-08-15
    #    ② 状態  **未決**（作ったが載せていない。いま 7 件で赤い）
    #    ③ 決める人  司令塔。7 件は left-sidebar / right-panel / labels-manager /
    #                settings-manager / login / layout の各担当へ回す必要がある
    #    ④ 何を決めるか  7 件を片付けてから載せるか、先に載せて全員に直させるか
    #    🚨 **コメントすら無いと「そんな検査は無い」と読まれる**ので、
    #       存在と未決を、載せる場所そのものに書いておく。
    # control-height:
    #   root: "apps/studio"
    #   run: node scripts/check-control-height-tokens.mjs

    # 上流（shadcn）から持ち込まれる `cn-*` 独自クラスを入れないための検査。
    # 🚨 このリポジトリに その CSS 層は無い。一度 21 個入り込み、**メニューとアバターが
    #    素のまま画面に出た**（堀池さんのスクリーンショット 2 枚・2026-08-15）。
    # 🚨 寸法の検査では気づけない——**素のままの項目も高さは正しい**ので面の監査は緑のままだった。
    # 🚨 以前の版は「参照はあるが定義が無いもの」を数えており、全部置き換わって参照 0 に
    #    なった結果、**何も見ていない緑**を返していた。しかも lefthook に載っておらず
    #    一度も走っていなかった。**在ること自体を違反にする形**へ据え直した。
    # 面の監査が「実在するのに巡回していないページ」を持っていないか。
    # 🚨 DEFAULT_PATHS は手書きなので、**ページが増えても勝手には入らない**。
    #    実測（2026-08-15）: 実在 29 / 巡回 20。差の 4 本は HTTP 200 で開けるのに一度も測っておらず、
    #    測ったら /admin/profile に違反 4 件が埋もれていた。
    # 🚨 「全部自動で拾う」にはしない。転送されるページや権限で開けないページを巻き込み、
    #    **除外の理由が消える**。漏れを見せて人に判断させる形にしてある（司令塔と合意）。
    audit-coverage:
      root: "apps/studio"
      run: node scripts/check-audit-coverage.mjs

    undefined-classes:
      root: "apps/studio"
      run: node scripts/check-undefined-classes.mjs

    # 生の行の型（FileRow / LabelRow）が外向きの返り値に出ていないか。
    # 🚨 型の印（brand）だけでは足りない。2026-08-15 に 4 通り試したところ、
    #    印が止めたのは「PublicFileRow と名乗って生の行を返す」形だけで、
    #    ①as で表明 ②<PublicFileRow> の山括弧 ③生の行の型を名乗る
    #    ④返り値の型を書かない は**全部素通り**した（tsc exit 0 を実測）。
    # 🚨 対象は 2 ファイルだけに絞ってある。広げると他の担当のコミットを落とす。
    #    増やすときは、増やした人が RED を測ってから増やすこと。
    raw-row-exports:
      root: "apps/studio"
      run: node scripts/check-raw-row-exports.mjs

    # 種まきしたシステムラベルが、辞書と部品の両方に登録されているか。
    # 🚨 知らない system_key は「保存されている名前」をそのまま出す作りなので、
    #    登録を忘れると **migration に書いた日本語が英語の画面にも出る**（2026-08-15 実測）。
    #    エラーにならないので、誰も気づけない。
    system-label-names:
      root: "apps/studio"
      run: node scripts/check-system-label-names.mjs

    # MCP のツール目録（packages/mcp/src/catalog.ts）と、Studio 側の写しが一致すること。
    # 🚨 **写しがあるのは、Studio から正を import できないから**（依存も exports も zod も無い。
    #    理由は check-mcp-catalog.mjs の冒頭に実測つきで書いてある）。写しは手で直さず `--write` で作る。
    # 🚨 **`packages/mcp` 側だけを変えた人は、どの検査にも引っかからない。**
    #    **この検査が、その唯一の橋**（正が変われば写しがずれて落ちる）。
    #    実際、`packages/mcp` が対象外だったせいで `/api/health` の変更が MCP を1日壊していた（2026-08-15）。
    #
    # 🚨 2026-08-16 に「**誰が落ちるか**」を測って直した。`shortcuts-manifest` と**鏡写し**だった:
    #    こちらは **正が root の外**（`packages/mcp/src/`）で**写しが中**なので、直す前の実測は
    #      ④' 正（packages/mcp）だけを変えた本人 …… 🚨 **skip（落ちない）**
    #      ①' 無関係な apps/studio を触った人 ……… 🔴 **exit=1（落ちる）**
    #    ＝ **変更した人と落ちる人が違う**のは、こちらに当てはまっていた。
    #    → glob を **正 + 写し + 検査自身**へ向けた。直したあとの実測（🎯 は狙い）:
    #      ④'🎯落ちる → 🔴 exit=1 ／ ①'🎯落ちない → 🟢 skip ／ ⑤' 写しを手で書き換えた人 🎯落ちる → 🔴 exit=1
    #      🟢 対照⑦' 壊さず無関係 → exit=0 ／ 🟢 対照⑧' CI 相当（--all-files） → exit=0
    #
    # 🚨 glob の書き方の罠（測って切り分けた。**書いたのに効かない**形）:
    #    ❌ `packages/mcp/src/**/*.ts` … **当たらない**（`**/` が **0 階層に一致しない**ので
    #       `src/catalog.ts` を拾わない）
    #    🟢 `packages/mcp/src/**` ／ `packages/mcp/src/*.ts` ／ `packages/mcp/**/*.ts` ／ `*.ts` … 当たる
    #    （`root:` があると root の外は staged_files から落ちるので、root は外して `run` 側で cd する）
    #
    # 🟢 **この glob には見ていない範囲が無い**（`shortcuts-manifest` の 292 本とはここが違う）:
    #    【測った】この検査が実際に読むファイルは **8 本**（fs を横取りして数えた）——
    #    `packages/mcp/src/{catalog,index,result,schemas,server,shortcuts-snapshot}.ts`
    #    ＋ `apps/studio/lib/mcp/tool-catalog.json` ＋ 検査自身。**下の 3 本が 8 本すべてを覆う。**
    mcp-catalog:
      glob:
        - "packages/mcp/src/**"                        # 正（ツール目録の実体）
        - "apps/studio/lib/mcp/tool-catalog.json"      # 写し
        - "apps/studio/scripts/check-mcp-catalog.mjs"  # 検査自身
      run: cd apps/studio && node scripts/check-mcp-catalog.mjs

    # ナビに出した画面を横断検索へ入れ忘れないための検査。
    # ルート一覧ではなくナビの行き先と比べる（個人設定など、検索へ入れると権限が壊れる画面がある）。
    search-entries:
      root: "apps/studio"
      run: node scripts/check-search-entries.mjs

    # 面の入れ子（knowledge/decisions/no-nested-surfaces.md「面は1段まで」）。
    # 🚨 2026-08-15 まで**書いてあるだけで一度も走っていなかった**。lefthook にも CI にも
    #    載っておらず、「面の入れ子は検査されている」と信じる根拠にだけなっていた。
    #    載せる直前に実測したら**違反 1 件**（`form-draft.tsx` の復元帯・polish のもの）が出た。
    #    ＝ **走っていない検査は、緑でも赤でもなく「何も言っていない」。**
    surface-nesting:
      root: "apps/studio"
      run: node scripts/check-surface-nesting.mjs

    # 二重送信の門（hooks/use-submit-once.ts）が外れていないか。
    # 🚨 これも同じく未接続だった。載せた時点で緑（未防御 0・移行待ち 4 件は担当が別）。
    submit-once:
      root: "apps/studio"
      run: node scripts/check-submit-once.mjs

    # オンボーディングの「画面が送る鍵」と「API が必須にする鍵」のずれ。
    # 🚨 2026-08-15 に実際に壊れた: `7b923d9` がフォームからだけ tenant_name を外し、
    #    API 側はそのままだったので、**新規インストールで初期設定を一度も終えられなかった**
    #    （「はじめる」は tenant_name、「あとで」は project_name で 400）。
    # 🚨 **一日誰も気づかなかった理由が重要**: :3101 / :3102 / :3103 はどれも
    #    onboarding_completed_at が入っていて /onboarding が 307 になるため、
    #    **共有環境では誰もこの画面に到達できない**（Storybook の story は API に届かない）。
    #    ＝ 人が踏めない経路なので、機械で見るしかない。
    # 🚨 「手で叩いた緑」と「門が出した緑」を分けて書く（2026-08-16 の規律）。
    #    載せる前: **手で叩いた緑**（自己検査 4/4 検出・違反 0・exit 0）
    #      → 🚨 これは「載った」の証拠になりません。staged が無いと lefthook は
    #        `(skip) no matching staged files` で **走らずに exit 0** になるためです。
    #    2026-08-16 追測: **門が出した緑・赤**（HEAD 8d63018 / `--all-files`）
    #      🟢 GREEN  ✔️ onboarding-contract 0.16s（**(skip) が出ない**＝走った）
    #      🔴 RED1   退行そのものの形（validate に literal）へ戻す
    #                → 🥊 / lefthook exit=1 / 違反 2 件 [literal-to-validate][no-omit-guard]
    #      🔴 RED2   ループは残し `key in input` の門番だけ外す（一見それらしい形）
    #                → 🥊 / lefthook exit=1 / 違反 1 件 [no-omit-guard]
    #      🟢 戻すと exit=0 に戻る（＝赤が壊しに追随していた）
    #    🚨 RED のとき、自己検査も「囮の置換が当たらない」と申告して赤になります。
    #      実物が既にその形なので囮を作れないためで、**正しい挙動**です
    #      （規則の違反 2 件は別に名指しされています。両方読んでください）。
    onboarding-contract:
      root: "apps/studio"
      run: node scripts/check-onboarding-contract.mjs

    # packages/* の型。
    # 🚨 2026-08-15 まで **packages は lefthook のどの項目からも見られていなかった**
    #    （root: "apps/studio" の外なので、staged が packages だけだと 12 項目中 10 が飛び、
    #      走るのは secrets と knowledge の 2 つだけ。🟢 対照: apps/studio のファイルなら 12 項目すべて走る）。
    #    その状態で `ohmycms_health` の出力スキーマが約1日壊れていた（saml 実測）。
    # 🚨 glob は付けない。**staged が packages 以外でも走らせる**——`apps/studio` の変更が
    #    packages の型を壊すことがあるため（health の鍵が増えて MCP のスキーマが弾いた、が実例）。
    #    実測 890ms なので毎回走らせても pre-commit の「速いものだけ」に収まる。
    packages-typecheck:
      run: bash .lefthook/packages-typecheck.sh

    # ✅ 守り: **構文が壊れた .mjs / .cjs はコミットできない。**（1 行で言える形）
    # 🚨 なぜ eslint では足りないか（2026-08-15 実測）: 上の `lint` は `root: "apps/studio"` なので
    #    **そこから出たファイルを 1 つも見ない**。直接当てても eslint 自身が拒否する
    #    （`0:0 warning File ignored because outside of base path` / **exit 0**）。
    #    内訳: apps/studio 32（eslint が見ている・対照で確認）/ **acceptance 24 / packages 5 が無防備**だった。
    # 🚨 注意書きでは効かない: テンプレートリテラルにバッククォートを書いて文字列が途中で終わる事故を
    #    1 日で 5 回踏んだ（**注意書きを 2 箇所に足した後でも踏んだ**）。**通らない形にする。**
    # 🚨 この検査が見ていない範囲: **構文だけ**（型・未定義は見ない）。`.js` は見ない
    #    （ESM/CJS がファイル単体で決まらないため）。`node --check` は import 先を解決しない。
    syntax:
      glob: "*.{mjs,cjs}"
      run: bash .lefthook/syntax-check.sh {staged_files}

    # `/api/health` の鍵と MCP の `HEALTH_OUTPUT` の一致。
    # 🚨 **見ているのは health 1 本だけ**（出力スキーマは全部で 14 本ある）。
    #    残りは対応する API を静的に辿れない（ツール定義に叩き先が書かれていない）。
    #    全ツールを実プロトコルで叩くのは受入ハーネスの 10 番。**ここを「MCP は検査済み」と読まない。**
    # 🚨 root を付けない。**apps/studio と packages/ の両方を読む**検査なので。
    health-schema:
      run: node apps/studio/scripts/check-health-schema.mjs

    # 不具合報告が画面から送る鍵が、サーバが読む範囲に収まっているか。
    # 🚨 `bug-report-composer.tsx` は「自動で集めるものを増やさない」と宣言していたが、
    #    **守っているコードが無かった**（規律12）。サーバは validate() で受ける鍵を絞っているので
    #    保存はされないが、**送った時点でログ・プロキシには乗る**。線を越える側を止める。
    # 🚨 見ているのは**この 1 経路だけ**。他のフォームは見ていない。
    report-body-keys:
      run: node apps/studio/scripts/check-report-body-keys.mjs

    # ショートカットの一覧が、Skills 側の生成物とずれていないか。
    # 🚨 堀池さん 2026-08-15「AI が Chrome 拡張などでサイトを操作する時、活用する
    #    （**Skills・MCP で伝わるように**）」の、**Skills 側の実体**。
    # 🚨 生成物なので **更新しないと腐る**。ずれたら落ちる（`--write` で作り直す）。
    # 🚨 この検査が見ていない範囲: **実際に押して効いたかは 1 件も見ていない**（静的な導出だけ）。
    #    `useShortcut(` を**名前で探している**ので、別名で包まれたら見えない。
    # 🚨 **誰が落ちるか**を 2026-08-16 に測って直した（別 clone・staged を毎回確認）。
    #   直す前（`root: "apps/studio"` だけ・glob 無し）の実測:
    #     ①写しが古い + **無関係なファイル**だけ staged … 🔴 exit=1 ← **5 ペインが止まった形**
    #     ②元(shortcuts.ts)を変えた本人 …………………… 🔴 exit=1（**本人でも落ちていた**。
    #        司令塔の「本人では落ちない」は誤り。最初コメント追加で試して exit=0 になったが、
    #        🚨 **それは門が甘いのでなく、導出結果が変わらない壊し方だった**）
    #     ④`apps/studio` の**外だけ**を触るコミット（packages/mcp 等）… skip（古くても通る）
    #     ⑤🚨 **写しを手で書き換えてコミット** ……………… skip
    #        （写しに「手で直さない」と書いてあるのに**門は止めなかった**。写しは root の外だから）
    #   → root を外し、glob を **元 + 写し**に向けた。直したあとの実測（🎯 は狙い）:
    #     ①🎯落ちない → 🟢 skip ／ ②🎯落ちる → 🔴 exit=1 ／ ⑤🎯落ちる → 🔴 exit=1
    #     ⑥CI 相当(`--all-files`)・写しが古い 🎯落ちる → 🔴 exit=1
    #     🟢 対照⑦ 写しが正しい+無関係 → skip ／ 🟢 対照⑧ CI 相当・写しが正しい → **exit=0**
    #
    # 🚨 lefthook の性質 2 つ（測って分かった。ここを間違えると**静かに何も走らない**）:
    #   ・`root:` があるとき **glob はリポジトリ相対のフルパス**で書く（root からの相対は当たらない）。
    #     既存の `glob: "*.{ts,tsx}"` が効いているのは `*` が何にでも当たるから。
    #   ・`root:` があると **root の外は staged_files から落ちる** ので、
    #     `.claude/…` を glob に書いても効かない。**root を外すと HIT する**。
    #     → だから `run:` の側で `cd apps/studio` する。
    #
    # 🚨 **この glob が見ていない範囲**（塞げないものは隠さず書く）:
    #   生成器が実際に読むファイルは **292 本**（node_modules 除く。fs を横取りして数えた）。
    #   ＝ 下の 5 本の外にも、原理的に写しを動かせる経路が在る。
    #   🚨 「実際に動かせるか」は 2 通り試して**どちらも動かせなかった**
    #      （別部品に `useShortcut(SHORTCUTS.toggleRightSidebar, …)` を足す／layout から
    #        global-search の行を消す）が、**「狭いらしい」までしか言えない。「狭い」とは言えない**。
    #   → **CI の `bun x lefthook run pre-commit --all-files` を最後の網として残す**（⑥⑧で確認済み）。
    # 🚨 検査が「違反を集めたのに、誰も読んでいない」形になっていないか。
    # 由来: 2026-08-16。`check-surface-nesting` は違反を `hits` へ集めていたが、
    #   **`hits` を読む場所がどこにも無かった**（push の 1 箇所だけ）。
    #   ＝ 面の入れ子を書いても落ちない。**緑だったが、守っていなかった。**
    #   囮を 5 通り試しても分からず、分かれ目は「**実在の許容行から許容規則を外す**」という
    #   **囮でない実験**だった（＝ 同じ種類の実験を繰り返しても分けられない）。
    # 🚨 **いま 0 件。止めるためではなく、次に検査を足す人の手元で落とすために載せる**
    #   （違反が出てから載せると、載せる作業と直す作業が同時に来る）。
    # 🚨 glob を `scripts/*.mjs` に絞ってあるので、**検査を書く人しか当たらない**（toast の提案）。
    #   毎回 2 つの対照を出す: 固定の見本 ＋ **`bd62c51^`（実在の事故）から `hits` を見つける**。
    #   見ていない範囲は検査の冒頭に書いてある（配列以外は見ない／`exit(1)` の有無では見ない 等）。
    collected-but-unread:
      glob: "apps/studio/scripts/*.mjs"
      run: cd apps/studio && node scripts/check-collected-but-unread.mjs

    shortcuts-manifest:
      glob:
        - "apps/studio/components/admin/shortcuts.ts"          # 鍵と項目の元
        - "apps/studio/lib/admin/page-actions.ts"              # save の効くルートの元
        - "apps/studio/scripts/build-shortcuts-manifest.mjs"   # 生成器そのもの
        - "apps/studio/scripts/tiptap-combos.mjs"              # 予約済みの組み合わせの元
        - ".claude/skills/ohmycms-mcp/references/shortcuts.md" # 🚨 写し自身（⑤ を塞ぐ）
        # 🚨 2026-08-16 に足した（案B・司令塔承認）。**画面そのものが写しの中身を決めるから**。
        #    写しの「モードで出し分ける画面」「押せる状態でないと効かない画面」は、
        #    各ルートの到達先から「編集する」ボタンと `<PageAction … disabled=…>` を探して作る。
        #    ＝ **画面の .tsx を変えると写しが変わる**。
        #    実測: `65d8615`（`item-form.tsx` を表示/編集モードに分けた）で 5 → 7 件に増え、
        #    🚨 **分割した本人は落ちず、次に上の 5 本へ触った人（polish）が踏んだ**
        #    ＝ 今日 4 回目の「変更した人と、落ちる人が違う」。
        #    🚨 **`3969dea`（生成器も索引から読む）では足りない**——索引化は
        #    「共有ツリーで緑・clean で赤」を消すもので、**検査が走るかどうかは glob の話**。
        #    🚨 副作用は意図したもの: **画面を触る人はほぼ全員この検査に当たる**（`--write` で直せる）。
        - "apps/studio/components/admin/*.tsx"                 # 画面の部品（67 本）
        - "apps/studio/app/(admin)/**/*.tsx"                   # 画面そのもの（32 本）
      run: cd apps/studio && node scripts/build-shortcuts-manifest.mjs

    # 本文（リッチテキスト）の保存側のガード。危険な URL / 許可外の節点 / 自作ブロックの属性、
    # そして **Mod-Enter を Tiptap へ返していないこと**（返すと保存に改行が混ざる）を見る。
    # 🚨 2026-08-15 まで **package.json には在るのに lefthook に載っておらず、一度も自動では走っていなかった**
    #    （`check:richtext` は手で叩いたときだけ動いていた）。載せる前に回して 53 件 PASS を確認済み。
    # 🚨 見ているのは**ソースに在るか**だけ。**実際に押して確かめてはいない**（それはブラウザの受入）。
    # 欄名の辞書（設問286 A）。表示側が生の識別子へ落ちること・
    # 書き込み側が壊れた形を通さないこと（fail-closed）。
    # 利用者の表を、入口（itemsTable）を通さずに開いていないか（設問288 A）。
    items-entry:
      run: node apps/studio/scripts/check-items-entry.mjs

    field-labels:
      run: cd apps/studio && bun scripts/check-field-labels.ts

    richtext:
      root: "apps/studio"
      run: bun run check:richtext

    # `/api/health` の `dirty` を意味のある旗のまま保つ（.dockerignore と docker/Dockerfile）。
    # 🚨 root を付けない。**リポジトリ直下の 2 ファイル**を読む検査なので。
    # 🚨 これは「コメントに **消さないこと** と書いてあるだけ」だったものを検査にしたもの（規律12）。
    #    1 行消えると dirty が毎回 1 に戻り、**旗が常に立つので誰も見なくなる**。
    #    見ているのは**その 2 ファイルの中身だけ**で、**実際にビルドして 0 が出るかは見ていない**
    #    （それは push 後の `/api/health` でしか分からない）。
    build-info-guards:
      run: node apps/studio/scripts/check-build-info-guards.mjs

    # ナレッジ索引の鮮度。**警告のみでコミットは止めない**（理由はスクリプト内）。
    knowledge:
      run: bash .lefthook/rokf-doctor.sh

    # docs/ の索引（docs/index.md）と実体の食い違い。**両方向を見る**（足し忘れ・消し忘れ）。
    # 🚨 由来（2026-08-16）: docs/ は 18 本あるのに索引が無く、**docs/ の外から一度も
    #    参照されない文書が 9 本**あった（**この検査を作った日に書いたものも 1 本**）。
    #    `knowledge/` には index.md と鮮度検査が在るのに、docs/ には無かった。
    # 🚨 **root: を付けない。** docs/ はリポジトリ直下なので、`root: "apps/studio"` を付けると
    #    **docs/ だけを触るコミットで飛ぶ**（＝ 索引の足し忘れが、いちばん起きる場面で走らない）。
    # 🚨 glob も付けない。**索引に載っている実体が消えた**ときは docs/ を触らないコミットでも
    #    食い違うため（例: 別の枝で消したものが入ってくる）。0.1 秒程度なので毎回走らせる。
    docs-index:
      run: node apps/studio/scripts/check-docs-index.mjs

    # ⌘Enter で保存できる画面が、**黙って減らない**ようにする。
    # 🚨 由来（2026-08-16）: d635b58 で `PAGE_ACTIONS` から 4 ルートの宣言が消え、
    #    **⌘Enter で保存できる画面が 4 つ減った**。`mcp-catalog` は赤くなったが、
    #    **写しを作り直したら緑に戻り、減ったことは緑の中に残った**（ff1fe6b / 58f6973）。
    #    design の原文:「写しを作り直して緑にして満足しました。減ったことは緑の中に残ったままでした」
    #    ＝ **「緑になったこと」と「直ったこと」は別**。この検査はその差を埋める。
    # 🚨 守る理由: ⌘Enter は**キーボードだけで操作する人の保存の導線**。
    #    マウスで押せる人には代わりが在るが、**そうでない人には代わりが無い**。
    # 🚨 `mcp-catalog` とは役割が違う。あちらは「正と写しが一致するか」、
    #    こちらは「**効く画面が減っていないか**」。一致していても減ることが在る（それが由来）。
    # 🚨 glob も root も付けない。減るのは `page-actions.ts` を触らないコミットでも起きうる
    #    （写しだけ作り直す形）。0.1 秒程度なので毎回走らせる。
    save-shortcut-routes:
      run: node apps/studio/scripts/check-save-shortcut-routes.mjs
