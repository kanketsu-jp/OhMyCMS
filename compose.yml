# docker compose up -d --build だけで DB もアプリも起動する。
#
# このファイルをリポジトリルートに置いているのは、compose が .env を
# 「プロジェクトディレクトリ = compose ファイルのある場所」から読むため。
# docker/compose.yml に置いて -f docker/compose.yml で叩くと、読まれるのは docker/.env に
# なってしまい、ルートの .env が黙って無視される（実測）。--env-file を毎回付ければ回避できるが、
# 受入基準は「docker compose up だけで起動する」なのでフラグ前提にしない。
#
# name を明示しているのは、プロジェクト名がディレクトリ名からの推測（この場合 cms）になり、
# ボリューム名・ネットワーク名が他PJと衝突しうるため。
name: ohmycms

# 変数の既定値をここに持たせているので、.env が無くても（= .env.example をコピーし忘れても）
# 同じ値で起動する。.env に書けば上書きされる。
x-postgres-user: &postgres-user ${POSTGRES_USER:-cms}
x-postgres-password: &postgres-password ${POSTGRES_PASSWORD:-cms}
x-postgres-db: &postgres-db ${POSTGRES_DB:-cms}

# アプリ → DB は compose ネットワーク内のホスト名 db:5432 で繋ぐ。
# ホスト側の .env にある DATABASE_URL (localhost:5436) は bun run dev / bun run migrate 用で、
# コンテナ内では localhost が自分自身を指してしまうため使えない。
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-cms}:${POSTGRES_PASSWORD:-cms}@db:5432/${POSTGRES_DB:-cms}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET: ${R2_BUCKET:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  AUTH_SECRET: ${AUTH_SECRET:-}
  ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-}
  # コンテナ内の待ち受けポート。Dockerfile の PORT=3000 を上書きし、公開ポートと一致させる。
  PORT: ${STUDIO_PORT:-3101}
  # 表示・ホワイトラベル。既定値はアプリ側にも持たせてあるので、ここは空で渡してよい
  # （空文字を渡してもアプリ側の既定 ja / OhMyCMS にフォールバックする）。
  OHMYCMS_DEFAULT_LOCALE: ${OHMYCMS_DEFAULT_LOCALE:-}
  OHMYCMS_PROJECT_NAME: ${OHMYCMS_PROJECT_NAME:-}
  OHMYCMS_PROJECT_LOGO_URL: ${OHMYCMS_PROJECT_LOGO_URL:-}

services:
  db:
    image: postgres:17
    container_name: ohmycms-db
    ports:
      - "${DB_PORT:-5436}:5432"
    environment:
      POSTGRES_USER: *postgres-user
      POSTGRES_PASSWORD: *postgres-password
      POSTGRES_DB: *postgres-db
    volumes:
      - ohmycms-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cms} -d ${POSTGRES_DB:-cms}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # 使い捨てのマイグレーション実行。studio はこれが成功してから起動する。
  # studio の entrypoint で流さないのは、失敗がアプリのログに埋もれず、
  # スケールアウトしたときに同じ migration が同時に走らないようにするため。
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
    image: ohmycms-migrate
    container_name: ohmycms-migrate
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  studio:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    image: ohmycms-studio
    container_name: ohmycms-studio
    ports:
      # 🚨 公開ポートとコンテナ内ポートを**一致させる**。
      #    requestOrigin() が host ヘッダから自分の URL を組み立てて自分自身を fetch するため、
      #    ズレていると内部呼び出しが ECONNREFUSED になり、管理画面が全ページ 500 になる。
      #    実測: 3101:3000 では /api/health と /login は 200 だが **/admin は 500**。
      #          curl で API だけ叩くと気づけない（AGENTS.md §4「curl を表示確認と書かない」の実例）。
      - "${STUDIO_PORT:-3101}:${STUDIO_PORT:-3101}"
    environment: *app-env
    volumes:
      # S3 未設定時のローカルフォールバック先。コンテナを作り直しても消えないようにする。
      - ohmycms-storage:/app/.storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ohmycms-db-data:
  ohmycms-storage:
